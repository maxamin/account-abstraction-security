name: lint
on: [push, pull_request]
jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: '**/*.md'
        continue-on-error: true
      - uses: lycheeverse/lychee-action@v1
        with:
          args: --no-progress --exclude-mail '**/*.md'
        continue-on-error: true
